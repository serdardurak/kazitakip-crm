<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kazı Takip — Panel</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --card2: #263349;
    --yellow: #f59e0b; --yellow-light: #fcd34d;
    --muted: #64748b; --muted2: #94a3b8;
    --green: #22c55e; --blue: #3b82f6; --red: #ef4444; --line: #334155;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #e2e8f0; padding-bottom: 70px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .header { background: var(--card); border-bottom: 2px solid var(--yellow); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
  .brand { display: flex; align-items: center; gap: 9px; }
  .logo { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(150deg, var(--yellow-light), var(--yellow)); display: flex; align-items: center; justify-content: center; font-weight: 900; color: #1e293b; font-size: 13px; }
  .brand-title { font-size: 12.5px; font-weight: 900; color: var(--yellow); letter-spacing: 1px; }
  .brand-sub { font-size: 10px; color: var(--muted); }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn { background: var(--card2); border: 1px solid var(--line); color: var(--muted2); border-radius: 9px; padding: 7px 10px; font-size: 11.5px; font-weight: 700; cursor: pointer; text-decoration: none; }
  .container { max-width: 480px; margin: 0 auto; padding: 16px; }
  .state-box { text-align: center; padding: 60px 20px; color: var(--muted2); font-size: 13px; }
  .err-box { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; border-radius: 10px; padding: 12px; font-size: 12px; margin-bottom: 12px; }
  .ok-box { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3); color: #86efac; border-radius: 10px; padding: 12px; font-size: 12px; margin-bottom: 12px; }
  .trial-badge { display: flex; align-items: center; gap: 8px; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); border-radius: 9px; padding: 9px 12px; font-size: 11.5px; color: var(--yellow-light); margin-bottom: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 13px; padding: 15px; margin-bottom: 12px; }
  .card h3 { font-size: 13px; margin: 0 0 10px; color: #f1f5f9; }
  .field { margin-bottom: 11px; }
  .field label { display: block; font-size: 10.5px; color: var(--muted2); margin-bottom: 5px; font-weight: 700; }
  .field input, .field select, .field textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 10px 11px; color: #e2e8f0; font-size: 13px; font-family: inherit; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--yellow); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { border: none; border-radius: 10px; font-weight: 800; font-size: 12.5px; padding: 10px 16px; cursor: pointer; background: linear-gradient(150deg, var(--yellow-light), var(--yellow)); color: #1e293b; }
  .btn.full { width: 100%; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .list-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1c2940; font-size: 12.5px; }
  .list-row:last-child { border-bottom: none; }
  .list-row .del { color: var(--red); font-size: 11px; cursor: pointer; font-weight: 700; }
  .muted { color: var(--muted2); }
  .proj-card { border-left: 3px solid var(--yellow); }
  .proj-card .name { font-weight: 800; font-size: 13.5px; color: var(--yellow-light); margin-bottom: 8px; }
  .progress-bar { height: 7px; background: var(--bg); border-radius: 5px; overflow: hidden; margin: 6px 0; }
  .progress-fill { height: 100%; background: var(--blue); }
  .progress-label { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted2); }

  /* PROJE KARTLARI — "Saha Etiketi" tasarımı (Kazı Takip'ten) */
  .scard { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px 12px; overflow: hidden; margin-bottom: 12px; }
  .scard.aktif { border-color: rgba(245,158,11,0.55); box-shadow: inset 3px 0 0 var(--yellow); }
  .scard.tamam { border-color: rgba(34,197,94,0.3); }
  .scard-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .scard-kod { font-family: ui-monospace, 'SF Mono', 'Roboto Mono', monospace; font-size: 10px; color: var(--muted2); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; letter-spacing: 1px; flex-shrink: 0; }
  .scard-durum { font-size: 9.5px; font-weight: 800; letter-spacing: .5px; color: var(--muted); white-space: nowrap; margin-left: auto; }
  .scard-durum.canli { color: var(--yellow); display: flex; align-items: center; gap: 5px; }
  .scard-durum.tamam-rozet { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.4); border-radius: 20px; padding: 3px 9px; }
  .scard-durum.canli .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--yellow); flex-shrink: 0; animation: scard-pulse 1.6s infinite; }
  @keyframes scard-pulse {
    0%   { box-shadow: 0 0 0 0 rgba(245,158,11,.55); }
    70%  { box-shadow: 0 0 0 6px rgba(245,158,11,0); }
    100% { box-shadow: 0 0 0 0 rgba(245,158,11,0); }
  }
  .scard-isim { margin-top: 8px; font-size: 14px; font-weight: 800; letter-spacing: .3px; text-transform: uppercase; color: #f1f5f9; line-height: 1.25; }
  .scard.aktif .scard-isim { color: var(--yellow); }
  .scard-konum { margin-top: 3px; font-size: 11px; color: var(--muted2); }
  .scard-divider { border-top: 1px dashed var(--line); margin: 9px 0 8px; }
  .scard-ruler { position: relative; height: 8px; border-radius: 2px; background: rgba(148,163,184,.12); background-image: repeating-linear-gradient(90deg, rgba(148,163,184,.4) 0 1px, transparent 1px 8px); overflow: hidden; }
  .scard-ruler-fill { position: absolute; inset: 0; width: 0%; border-radius: 2px 0 0 2px; background: linear-gradient(90deg, #f59e0b, #fbbf24); }
  .scard.tamam .scard-ruler-fill { background: linear-gradient(90deg, #22c55e, #4ade80); }
  .scard-ruler-labels { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-family: ui-monospace, 'SF Mono', 'Roboto Mono', monospace; font-size: 10px; color: var(--muted); }
  .scard-ruler-pct { color: #f1f5f9; font-weight: 700; }
  .scard-meta { font-family: ui-monospace, 'SF Mono', 'Roboto Mono', monospace; font-size: 10.5px; color: var(--muted2); }
  .scard-icobtn { flex-shrink: 0; width: 25px; height: 25px; border-radius: 6px; border: 1px solid var(--line); background: none; color: var(--muted2); font-size: 12px; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; padding: 0; }
  .scard-icobtn.tamamla { border-color: rgba(34,197,94,.4); color: #4ade80; }
  .scard-icobtn.ac { border-color: var(--line); color: var(--muted2); }
  .scard-icobtn.sil { border-color: rgba(239,68,68,.35); color: var(--red); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal-box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; text-align: center; max-width: 300px; }
  .modal-box h3 { font-size: 14px; margin: 0 0 14px; }
  .modal-box .qr-wrap { background: #fff; padding: 12px; border-radius: 10px; display: inline-block; }
  .modal-box .btn { margin-top: 16px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; }
  .subtab { flex-shrink: 0; padding: 8px 13px; border-radius: 8px; font-size: 11.5px; font-weight: 700; background: var(--card2); color: var(--muted2); cursor: pointer; }
  .subtab.on { background: var(--yellow); color: #1e293b; }
  .role-pill { font-size: 10px; padding: 3px 9px; border-radius: 20px; font-weight: 700; }
  .role-yonetici { background: rgba(245,158,11,0.14); color: var(--yellow-light); }
  .role-saha_personeli { background: rgba(59,130,246,0.14); color: #93c5fd; }
  .role-sadece_rapor { background: rgba(100,116,139,0.2); color: var(--muted2); }
  .status-pending { color: #fcd34d; }
  .status-active { color: #86efac; }
  .readonly-notice { background: var(--card2); border: 1px dashed var(--line); border-radius: 10px; padding: 12px; font-size: 11.5px; color: var(--muted2); text-align: center; margin-bottom: 12px; }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--line); display: flex; z-index: 10; }
  .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 9px 2px; background: none; border: none; color: var(--muted); font-size: 9.5px; font-weight: 700; gap: 3px; cursor: pointer; }
  .nav-btn .ic { font-size: 17px; }
  .nav-btn.on { color: var(--yellow); }
</style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo">K</div>
      <div>
        <div class="brand-title">KAZI TAKİP</div>
        <div class="brand-sub" id="firmaAdiHeader">—</div>
      </div>
    </div>
    <div class="header-actions">
      <a class="icon-btn" href="abonelik.html">Abonelik</a>
      <div class="icon-btn" onclick="ortakCikisYap()">Çıkış</div>
    </div>
  </div>
  <div class="container" id="container">
    <div class="state-box" id="loadingBox">Yükleniyor...</div>
  </div>
  <nav class="bottom-nav" id="bottomNav" style="display:none">
    <button class="nav-btn" id="nav-dashboard" onclick="gitView('dashboard')"><span class="ic">📊</span><span>Panel</span></button>
    <button class="nav-btn" id="nav-kayit" onclick="gitView('kayit')"><span class="ic">➕</span><span>Kayıt</span></button>
    <button class="nav-btn" id="nav-projeler" onclick="gitView('projeler')"><span class="ic">🏗</span><span>Projeler</span></button>
    <button class="nav-btn" id="nav-giderler" onclick="gitView('giderler')"><span class="ic">💸</span><span>Giderler</span></button>
    <button class="nav-btn" id="nav-yonetim" onclick="gitView('yonetim')"><span class="ic">⚙️</span><span>Yönetim</span></button>
  </nav>
  <div class="modal-overlay" id="qrModal" style="display:none" onclick="if(event.target===this) qrKapat()">
    <div class="modal-box">
      <h3 id="qrBaslik">Proje QR Kodu</h3>
      <div class="qr-wrap" id="qrCanvas"></div>
      <button class="btn" onclick="qrKapat()">Kapat</button>
    </div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const SUPABASE_URL = 'https://wqqdcowrtlvfruvsmtew.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_bfPBnm138vlmJa_z4Pi95w_EsYw2zkB';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const ROL_ETIKETLERI = { yonetici: 'Yönetici', saha_personeli: 'Saha Personeli', sadece_rapor: 'Sadece Rapor' };
  const PLAN_ETIKETLERI = { deneme: 'Deneme Sürümü', aktif: 'Aktif', gecikmis: 'Gecikmiş Ödeme', iptal: 'İptal Edildi' };
  const KULLANICI_BASI_FIYAT = 149;
  async function ortakOturumKontrol(girisSayfasi) {
    girisSayfasi = girisSayfasi || 'index.html';
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = girisSayfasi; return null; }
    return session;
  }
  async function ortakProfilYukle(userId) {
    return await sb.from('kullanicilar').select('id, ad_soyad, email, rol, firma_id, firmalar ( ad, plan_durumu, deneme_bitis_tarihi )').eq('id', userId).single();
  }
  async function ortakCikisYap(girisSayfasi) {
    girisSayfasi = girisSayfasi || 'index.html';
    await sb.auth.signOut();
    window.location.href = girisSayfasi;
  }
  let currentUser = null;
  let currentFirma = null;
  let lookups = { projeler: [], ekipler: [], denetimciler: [], malzeme_turleri: [], gider_kategorileri: [] };
  let yonetimTab = 'ekipler';
  let editingKayitId = null;
  let secilenFoto = null;
  const yazabilir = () => currentUser && currentUser.rol !== 'sadece_rapor';
  const isim = (arr, id) => (arr.find(x => x.id === id) || {}).ad || '—';

  async function init() {
    try {
      const session = await ortakOturumKontrol('index.html');
      if (!session) return;
      const { data: profil, error } = await ortakProfilYukle(session.user.id);
      if (error || !profil) {
        document.getElementById('container').innerHTML = `<div class="err-box">Profil alınamadı: ${(error && error.message) || 'bilinmiyor'}</div>`;
        return;
      }
      currentUser = { id: profil.id, firma_id: profil.firma_id, rol: profil.rol, ad_soyad: profil.ad_soyad, email: profil.email };
      currentFirma = profil.firmalar;
      document.getElementById('firmaAdiHeader').textContent = currentFirma.ad;
      document.getElementById('bottomNav').style.display = 'flex';
      await loadLookups();
      gitView('dashboard');
    } catch (e) {
      document.getElementById('container').innerHTML = `<div class="err-box">Bir hata oluştu: ${e.message || e}<br><br><button class="btn" onclick="location.reload()">Yeniden Dene</button></div>`;
      console.error('init() hatası:', e);
    }
  }

  async function loadLookups() {
    const [p, e, d, m, g] = await Promise.all([
      sb.from('projeler').select('id, ad, konum, hedef_metre, durum').neq('durum', 'silindi').order('ad'),
      sb.from('ekipler').select('id, ad').order('ad'),
      sb.from('denetimciler').select('id, ad, kurum').order('ad'),
      sb.from('malzeme_turleri').select('id, ad').order('ad'),
      sb.from('gider_kategorileri').select('id, ad').order('ad'),
    ]);
    lookups.projeler = p.data || [];
    lookups.ekipler = e.data || [];
    lookups.denetimciler = d.data || [];
    lookups.malzeme_turleri = m.data || [];
    lookups.gider_kategorileri = g.data || [];
  }

  function gitView(v) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('on'));
    document.getElementById('nav-' + v).classList.add('on');
    ({ dashboard: renderDashboard, kayit: renderKayit, projeler: renderProjeler, giderler: renderGiderler, yonetim: renderYonetim })[v]();
  }

  function toast(container, msg, ok) {
    const box = document.createElement('div');
    box.className = ok ? 'ok-box' : 'err-box';
    box.textContent = msg;
    container.prepend(box);
    setTimeout(() => box.remove(), 3500);
  }

  async function renderDashboard() {
    const c = document.getElementById('container');
    c.innerHTML = `<div class="state-box">Yükleniyor...</div>`;
    const kalanGun = Math.max(0, Math.ceil((new Date(currentFirma.deneme_bitis_tarihi) - new Date()) / 86400000));
    const { data: kayitlar } = await sb.from('kayitlar').select('proje_id, metraj');
    const aktifProjeler = lookups.projeler.filter(p => p.durum === 'aktif' || p.durum === 'bitti');
    const projeKarti = aktifProjeler.map((p, i) => {
      const toplam = (kayitlar || []).filter(k => k.proje_id === p.id).reduce((s, k) => s + Number(k.metraj), 0);
      const yuzde = p.hedef_metre ? Math.min(100, Math.round((toplam / p.hedef_metre) * 100)) : 0;
      const tamam = p.durum === 'bitti';
      const kod = 'P-' + String(i + 1).padStart(2, '0');
      const durumHtml = tamam
        ? `<span class="scard-durum tamam-rozet">✓ TAMAMLANDI</span>`
        : `<span class="scard-durum canli"><span class="dot"></span>SAHADA</span>`;
      const ruler = p.hedef_metre
        ? `<div class="scard-divider"></div>
           <div class="scard-ruler"><div class="scard-ruler-fill" style="width:${yuzde}%"></div></div>
           <div class="scard-ruler-labels"><span>0m</span><span class="scard-ruler-pct">%${yuzde}</span><span>${Number(p.hedef_metre).toLocaleString('tr-TR')}m</span></div>`
        : `<div class="scard-divider"></div><div class="scard-meta">${toplam.toLocaleString('tr-TR')} m toplam</div>`;
      return `<div class="scard ${tamam ? 'tamam' : 'aktif'}">
          <div class="scard-top"><span class="scard-kod">${kod}</span>${durumHtml}</div>
          <div class="scard-isim">🏗 ${p.ad}</div>
          ${p.konum ? `<div class="scard-konum">📍 ${p.konum}</div>` : ''}
          ${ruler}
        </div>`;
    }).join('') || `<div class="readonly-notice">Henüz aktif proje yok. "Projeler" sekmesinden ekleyebilirsin.</div>`;
    c.innerHTML = `
      <div class="card"><h3>Hoş geldin, ${currentUser.ad_soyad.split(' ')[0]}</h3>
        <div class="muted" style="font-size:12px;">${ROL_ETIKETLERI[currentUser.rol]} · ${currentFirma.ad}</div></div>
      ${currentFirma.plan_durumu === 'deneme' ? `<div class="trial-badge">⏳ Deneme sürümünde ${kalanGun} gün kaldı</div>` : ''}
      ${projeKarti}`;
  }

  function renderKayit() {
    const c = document.getElementById('container');
    if (!yazabilir()) { c.innerHTML = `<div class="readonly-notice">🔒 "Sadece Rapor" rolündesin, kayıt ekleyemezsin.</div><div id="kayitListesi"></div>`; kayitlariListele(); return; }
    editingKayitId = null; secilenFoto = null;
    const projOpts = lookups.projeler.filter(p => p.durum === 'aktif').map(p => `<option value="${p.id}">${p.ad}</option>`).join('');
    const ekipOpts = lookups.ekipler.map(e => `<option value="${e.id}">${e.ad}</option>`).join('');
    const denOpts = `<option value="">— Denetimci yok —</option>` + lookups.denetimciler.map(d => `<option value="${d.id}">${d.ad}${d.kurum ? ' (' + d.kurum + ')' : ''}</option>`).join('');
    const malOpts = `<option value="">—</option>` + lookups.malzeme_turleri.map(m => `<option value="${m.id}">${m.ad}</option>`).join('');
    c.innerHTML = `<div class="card" id="kayitFormCard"><h3 id="kayitFormBaslik">Yeni Kazı Kaydı</h3><div id="kayitMsg"></div>
      <div class="field"><label>Proje</label><select id="kProje">${projOpts || '<option value="">Önce proje ekle</option>'}</select></div>
      <div class="field-row">
        <div class="field"><label>Tarih</label><input type="date" id="kTarih" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="field"><label>Metraj (m)</label><input type="number" id="kMetraj" step="0.1" placeholder="0"></div>
      </div>
      <div class="field"><label>Ekip</label><select id="kEkip">${ekipOpts || '<option value="">Önce ekip ekle</option>'}</select></div>
      <div class="field"><label>Denetimci</label><select id="kDenetimci">${denOpts}</select></div>
      <div class="field"><label>Malzeme Türü</label><select id="kMalzeme">${malOpts}</select></div>
      <div class="field"><label>Notlar</label><textarea id="kNotlar" rows="2" placeholder="Varsa hata/uyarı notu"></textarea></div>
      <div class="field"><label>Fotoğraf (opsiyonel)</label><input type="file" id="kFoto" accept="image/*" onchange="fotoSecildi(event)"></div>
      <div id="kFotoOnizleme"></div>
      <button class="btn full" id="kKaydetBtn" onclick="kayitKaydet()">Kaydı Ekle</button>
      <button class="btn full" id="kIptalBtn" style="display:none;background:var(--card2);color:#e2e8f0;margin-top:6px;" onclick="renderKayit()">İptal</button>
      </div>
      <div id="kayitListesi"></div>`;
    kayitlariListele();
  }

  function fotoSecildi(ev) {
    secilenFoto = ev.target.files[0] || null;
    const onizleme = document.getElementById('kFotoOnizleme');
    onizleme.innerHTML = secilenFoto ? `<div class="muted" style="font-size:11px;margin:-4px 0 11px;">📎 ${secilenFoto.name}</div>` : '';
  }

  async function fotoYukle(kayitId) {
    if (!secilenFoto) return null;
    const uzanti = secilenFoto.name.split('.').pop();
    const yol = `${currentUser.firma_id}/${kayitId}-${Date.now()}.${uzanti}`;
    const { error } = await sb.storage.from('kayit-fotograflari').upload(yol, secilenFoto);
    if (error) { console.error('Foto yükleme hatası:', error.message); return null; }
    return yol;
  }

  async function kayitlariListele() {
    const el = document.getElementById('kayitListesi');
    const { data: son } = await sb.from('kayitlar')
      .select('id, tarih, metraj, proje_id, ekip_id, notlar, fotograflar')
      .order('tarih', { ascending: false }).limit(15);

    const liste = (son || []).map(k => `
      <div class="list-row" style="align-items:flex-start;">
        <div>
          <div><b>${isim(lookups.projeler, k.proje_id)}</b> <span class="muted mono">${k.tarih}</span></div>
          <div class="muted" style="font-size:11px;margin-top:2px;">${isim(lookups.ekipler, k.ekip_id)}${k.notlar ? ' · ' + k.notlar : ''}${(k.fotograflar||[]).length ? ' · 📷 ' + k.fotograflar.length : ''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
          <b class="mono">${Number(k.metraj).toLocaleString('tr-TR')} m</b>
          ${yazabilir() ? `
            <button class="scard-icobtn ac" onclick='kayitDuzenleAc(${JSON.stringify(k).replace(/'/g, "&apos;")})' title="Düzenle">✎</button>
            <button class="scard-icobtn sil" onclick="kayitSil('${k.id}')" title="Sil">✕</button>` : ''}
        </div>
      </div>`).join('') || `<div class="muted">Henüz kayıt yok.</div>`;

    el.innerHTML = `<div class="card"><h3>Son Kayıtlar</h3>${liste}</div>`;
  }

  function kayitDuzenleAc(k) {
    editingKayitId = k.id;
    document.getElementById('kayitFormBaslik').textContent = 'Kaydı Düzenle';
    document.getElementById('kProje').value = k.proje_id;
    document.getElementById('kTarih').value = k.tarih;
    document.getElementById('kMetraj').value = k.metraj;
    document.getElementById('kEkip').value = k.ekip_id || '';
    document.getElementById('kNotlar').value = k.notlar || '';
    document.getElementById('kKaydetBtn').textContent = 'Kaydı Güncelle';
    document.getElementById('kIptalBtn').style.display = 'block';
    document.getElementById('kayitFormCard').scrollIntoView({ behavior: 'smooth' });
  }

  async function kayitKaydet() {
    const msg = document.getElementById('kayitMsg');
    const proje_id = document.getElementById('kProje').value;
    const metraj = document.getElementById('kMetraj').value;
    if (!proje_id || !metraj) { toast(msg, 'Proje ve metraj zorunlu.', false); return; }

    const btn = document.getElementById('kKaydetBtn');
    btn.disabled = true;

    const veri = {
      proje_id,
      tarih: document.getElementById('kTarih').value,
      metraj: Number(metraj),
      ekip_id: document.getElementById('kEkip').value || null,
      denetimci_id: document.getElementById('kDenetimci').value || null,
      malzeme_turu_id: document.getElementById('kMalzeme').value || null,
      notlar: document.getElementById('kNotlar').value || null,
    };

    if (editingKayitId) {
      const { error } = await sb.from('kayitlar').update(veri).eq('id', editingKayitId);
      btn.disabled = false;
      if (error) { toast(msg, 'Hata: ' + error.message, false); return; }
      if (secilenFoto) {
        const yol = await fotoYukle(editingKayitId);
        if (yol) {
          const { data: mevcut } = await sb.from('kayitlar').select('fotograflar').eq('id', editingKayitId).single();
          await sb.from('kayitlar').update({ fotograflar: [...(mevcut.fotograflar || []), yol] }).eq('id', editingKayitId);
        }
      }
      toast(msg, '✅ Kayıt güncellendi.', true);
      renderKayit();
      return;
    }

    veri.firma_id = currentUser.firma_id;
    veri.olusturan_kullanici_id = currentUser.id;
    const { data: yeniKayit, error } = await sb.from('kayitlar').insert(veri).select('id').single();
    btn.disabled = false;
    if (error) { toast(msg, 'Hata: ' + error.message, false); return; }

    if (secilenFoto && yeniKayit) {
      const yol = await fotoYukle(yeniKayit.id);
      if (yol) await sb.from('kayitlar').update({ fotograflar: [yol] }).eq('id', yeniKayit.id);
    }

    toast(msg, '✅ Kayıt eklendi.', true);
    document.getElementById('kMetraj').value = '';
    document.getElementById('kNotlar').value = '';
    document.getElementById('kFoto').value = '';
    document.getElementById('kFotoOnizleme').innerHTML = '';
    secilenFoto = null;
    kayitlariListele();
  }

  async function kayitSil(id) {
    await sb.from('kayitlar').delete().eq('id', id);
    kayitlariListele();
  }

  function renderProjeler() {
    const c = document.getElementById('container');
    const liste = lookups.projeler.map((p, i) => {
      const tamam = p.durum === 'bitti';
      const kod = 'P-' + String(i + 1).padStart(2, '0');
      const durumHtml = tamam
        ? `<span class="scard-durum tamam-rozet">✓ TAMAMLANDI</span>`
        : `<span class="scard-durum canli"><span class="dot"></span>SAHADA</span>`;
      const butonlar = `
          <span class="scard-icobtn-group" style="margin-left:auto;display:flex;gap:6px;">
            <button class="scard-icobtn ac" onclick="qrGoster('${p.id}', '${p.ad.replace(/'/g, "&apos;")}')" title="QR Kod">▦</button>
            ${yazabilir() ? `
              ${!tamam ? `<button class="scard-icobtn tamamla" onclick="projeTamamla('${p.id}')" title="Tamamla">✓</button>` : `<button class="scard-icobtn ac" onclick="projeYenidenAc('${p.id}')" title="Yeniden aç">↺</button>`}
              <button class="scard-icobtn sil" onclick="projeSil('${p.id}')" title="Sil">✕</button>` : ''}
          </span>`;
      return `<div class="scard ${tamam ? 'tamam' : 'aktif'}">
          <div class="scard-top"><span class="scard-kod">${kod}</span>${durumHtml}${butonlar}</div>
          <div class="scard-isim">🏗 ${p.ad}</div>
          ${p.konum ? `<div class="scard-konum">📍 ${p.konum}</div>` : ''}
          ${p.hedef_metre ? `<div class="scard-meta" style="margin-top:6px;">Hedef: ${Number(p.hedef_metre).toLocaleString('tr-TR')} m</div>` : ''}
        </div>`;
    }).join('') || `<div class="muted">Henüz proje yok.</div>`;

    c.innerHTML = `
      <div id="projMsg"></div>
      ${liste}
      ${yazabilir() ? `<div class="card"><h3>Yeni Proje</h3>
        <div class="field"><label>Proje Adı</label><input id="pAd" placeholder="Silivri Öbek 4. Etap"></div>
        <div class="field-row">
          <div class="field"><label>Konum</label><input id="pKonum" placeholder="İstanbul"></div>
          <div class="field"><label>Hedef Metraj</label><input type="number" id="pHedef" placeholder="16000"></div>
        </div>
        <button class="btn full" onclick="projeEkle()">Projeyi Ekle</button></div>` : ''}`;
  }

  async function projeTamamla(id) {
    await sb.from('projeler').update({ durum: 'bitti' }).eq('id', id);
    await loadLookups(); renderProjeler();
  }

  async function projeYenidenAc(id) {
    await sb.from('projeler').update({ durum: 'aktif' }).eq('id', id);
    await loadLookups(); renderProjeler();
  }

  function qrGoster(projeId, projeAdi) {
    document.getElementById('qrBaslik').textContent = projeAdi;
    const kutu = document.getElementById('qrCanvas');
    kutu.innerHTML = '';
    new QRCode(kutu, {
      text: `KAZITAKIP|${currentFirma.ad}|${projeAdi}|${projeId}`,
      width: 180, height: 180
    });
    document.getElementById('qrModal').style.display = 'flex';
  }
  function qrKapat() { document.getElementById('qrModal').style.display = 'none'; }

  async function projeEkle() {
    const msg = document.getElementById('projMsg');
    const ad = document.getElementById('pAd').value.trim();
    if (!ad) { toast(msg, 'Proje adı gerekli.', false); return; }
    const { error } = await sb.from('projeler').insert({
      firma_id: currentUser.firma_id, ad,
      konum: document.getElementById('pKonum').value || null,
      hedef_metre: document.getElementById('pHedef').value || null
    });
    if (error) { toast(msg, 'Hata: ' + error.message, false); return; }
    await loadLookups(); renderProjeler();
    toast(document.getElementById('projMsg'), '✅ Proje eklendi.', true);
  }

  async function projeSil(id) {
    await sb.from('projeler').update({ durum: 'silindi' }).eq('id', id);
    await loadLookups(); renderProjeler();
  }

  async function renderGiderler() {
    const c = document.getElementById('container');
    c.innerHTML = `<div class="state-box">Yükleniyor...</div>`;
    const { data: giderler } = await sb.from('giderler').select('id, tarih, tutar, aciklama, kategori_id').order('tarih', { ascending: false }).limit(30);
    const liste = (giderler || []).map(g => `<div class="list-row">
        <div>${g.tarih} · <span class="muted">${isim(lookups.gider_kategorileri, g.kategori_id)}</span>${g.aciklama ? ' · ' + g.aciklama : ''}</div>
        <div style="display:flex;align-items:center;gap:10px;">
          <b class="mono">₺${Number(g.tutar).toLocaleString('tr-TR')}</b>
          ${yazabilir() ? `<button class="scard-icobtn sil" onclick="giderSil('${g.id}')" title="Sil">✕</button>` : ''}
        </div></div>`).join('') || `<div class="muted">Henüz gider yok.</div>`;
    const katOpts = lookups.gider_kategorileri.map(k => `<option value="${k.id}">${k.ad}</option>`).join('');
    const projOpts = `<option value="">—</option>` + lookups.projeler.map(p => `<option value="${p.id}">${p.ad}</option>`).join('');
    c.innerHTML = `<div class="card"><h3>Giderler</h3><div id="giderMsg"></div>${liste}</div>
      ${yazabilir() ? `<div class="card"><h3>Yeni Gider</h3>
        <div class="field-row">
          <div class="field"><label>Tarih</label><input type="date" id="gTarih" value="${new Date().toISOString().slice(0,10)}"></div>
          <div class="field"><label>Tutar (₺)</label><input type="number" id="gTutar" placeholder="0"></div>
        </div>
        <div class="field"><label>Kategori</label><select id="gKategori">${katOpts || '<option value="">Önce kategori ekle</option>'}</select></div>
        <div class="field"><label>Proje (opsiyonel)</label><select id="gProje">${projOpts}</select></div>
        <div class="field"><label>Açıklama</label><input id="gAciklama" placeholder="Not"></div>
        <button class="btn full" onclick="giderEkle()">Gideri Ekle</button></div>` : `<div class="readonly-notice">🔒 "Sadece Rapor" rolündesin, gider ekleyemezsin.</div>`}`;
  }

  async function giderSil(id) {
    await sb.from('giderler').delete().eq('id', id);
    renderGiderler();
  }

  async function giderEkle() {
    const msg = document.getElementById('giderMsg');
    const tutar = document.getElementById('gTutar').value;
    const kategori_id = document.getElementById('gKategori').value;
    if (!tutar || !kategori_id) { toast(msg, 'Tutar ve kategori zorunlu.', false); return; }
    const { error } = await sb.from('giderler').insert({
      firma_id: currentUser.firma_id,
      tarih: document.getElementById('gTarih').value,
      tutar: Number(tutar), kategori_id,
      proje_id: document.getElementById('gProje').value || null,
      aciklama: document.getElementById('gAciklama').value || null
    });
    if (error) { toast(msg, 'Hata: ' + error.message, false); return; }
    renderGiderler();
  }

  const referansTablolar = {
    ekipler: { tablo: 'ekipler', baslik: 'Ekipler', placeholder: 'Ekip adı' },
    denetimciler: { tablo: 'denetimciler', baslik: 'Denetimciler', placeholder: 'Denetimci adı' },
    malzeme_turleri: { tablo: 'malzeme_turleri', baslik: 'Malzeme Türleri', placeholder: 'Malzeme türü' },
    gider_kategorileri: { tablo: 'gider_kategorileri', baslik: 'Gider Kategorileri', placeholder: 'Kategori adı' }
  };

  function renderYonetim() {
    const c = document.getElementById('container');
    const tabs = Object.keys(referansTablolar).map(k =>
      `<div class="subtab ${yonetimTab===k?'on':''}" onclick="yonetimSekme('${k}')">${referansTablolar[k].baslik}</div>`
    ).join('') + (currentUser.rol === 'yonetici' ? `<div class="subtab ${yonetimTab==='kullanicilar'?'on':''}" onclick="yonetimSekme('kullanicilar')">Kullanıcılar</div>` : '');
    c.innerHTML = `<div class="tabs">${tabs}</div><div id="yonetimIcerik"></div>`;
    if (yonetimTab === 'kullanicilar') renderKullanicilar(); else renderReferansListe(yonetimTab);
  }

  function yonetimSekme(k) { yonetimTab = k; renderYonetim(); }

  function renderReferansListe(anahtar) {
    const conf = referansTablolar[anahtar];
    const veriler = lookups[anahtar];
    const liste = veriler.map(v => `<div class="list-row">
        <div>${v.ad}${v.kurum ? ' <span class="muted">· ' + v.kurum + '</span>' : ''}</div>
        <button class="scard-icobtn sil" onclick="referansSil('${anahtar}', '${v.id}')" title="Sil">✕</button></div>`).join('') || `<div class="muted">Henüz eklenmedi.</div>`;
    document.getElementById('yonetimIcerik').innerHTML = `<div class="card"><h3>${conf.baslik}</h3><div id="refMsg"></div>${liste}</div>
      <div class="card"><div class="field"><input id="refAd" placeholder="${conf.placeholder}"></div>
        ${anahtar === 'denetimciler' ? `<div class="field"><input id="refKurum" placeholder="Kurum (opsiyonel, örn. Mikrolink)"></div>` : ''}
        <button class="btn full" onclick="referansEkle('${anahtar}')">Ekle</button></div>`;
  }

  async function referansEkle(anahtar) {
    const conf = referansTablolar[anahtar];
    const ad = document.getElementById('refAd').value.trim();
    const msg = document.getElementById('refMsg');
    if (!ad) { toast(msg, 'Ad gerekli.', false); return; }
    const kayit = { firma_id: currentUser.firma_id, ad };
    if (anahtar === 'denetimciler') kayit.kurum = document.getElementById('refKurum').value || null;
    const { error } = await sb.from(conf.tablo).insert(kayit);
    if (error) { toast(msg, 'Hata: ' + error.message, false); return; }
    await loadLookups(); renderReferansListe(anahtar);
  }

  async function referansSil(anahtar, id) {
    await sb.from(referansTablolar[anahtar].tablo).delete().eq('id', id);
    await loadLookups(); renderReferansListe(anahtar);
  }

  async function renderKullanicilar() {
    const el = document.getElementById('yonetimIcerik');
    el.innerHTML = `<div class="state-box">Yükleniyor...</div>`;
    const { data: kullanicilar } = await sb.from('kullanicilar').select('ad_soyad, email, rol, durum').order('ad_soyad');
    const liste = (kullanicilar || []).map(k => `<div class="list-row">
        <div>${k.ad_soyad} <span class="muted">· ${k.email}</span></div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="${k.durum==='aktif'?'status-active':'status-pending'}">${k.durum==='aktif'?'●':'○'}</span>
          <span class="role-pill role-${k.rol}">${ROL_ETIKETLERI[k.rol]}</span>
        </div></div>`).join('');
    el.innerHTML = `<div class="card"><h3>Kullanıcılar</h3><div id="davetMsg"></div>${liste}</div>
      <div class="card"><h3>Kullanıcı Davet Et</h3>
        <div class="field"><label>Ad Soyad</label><input id="dAdSoyad" placeholder="Burak Durak"></div>
        <div class="field"><label>E-posta</label><input id="dEmail" type="email" placeholder="burak@firmam.com"></div>
        <div class="field"><label>Rol</label><select id="dRol">
            <option value="saha_personeli">Saha Personeli</option>
            <option value="sadece_rapor">Sadece Rapor</option>
            <option value="yonetici">Yönetici</option>
          </select></div>
        <button class="btn full" id="davetBtn" onclick="kullaniciDavetEt()">Davet Gönder</button></div>`;
  }

  async function kullaniciDavetEt() {
    const msg = document.getElementById('davetMsg');
    const ad_soyad = document.getElementById('dAdSoyad').value.trim();
    const email = document.getElementById('dEmail').value.trim();
    const rol = document.getElementById('dRol').value;
    if (!ad_soyad || !email) { toast(msg, 'Ad soyad ve e-posta gerekli.', false); return; }
    const btn = document.getElementById('davetBtn');
    btn.disabled = true; btn.textContent = 'Gönderiliyor...';
    const { data, error } = await sb.functions.invoke('davet-et', { body: { ad_soyad, email, rol } });
    btn.disabled = false; btn.textContent = 'Davet Gönder';
    if (error || (data && data.error)) { toast(msg, 'Hata: ' + ((data && data.error) || error.message), false); return; }
    toast(msg, '✅ Davet e-postası gönderildi: ' + email, true);
    renderKullanicilar();
  }

  init();
</script>
</body>
</html>
