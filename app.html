<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kazı Takip — Panel</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --card2: #263349;
    --yellow: #f59e0b; --yellow-light: #fcd34d;
    --muted: #64748b; --muted2: #94a3b8;
    --green: #22c55e; --red: #ef4444; --line: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #e2e8f0;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  .header {
    background: var(--card); border-bottom: 2px solid var(--yellow);
    padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(150deg, var(--yellow-light), var(--yellow));
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; color: #1e293b; font-size: 14px;
  }
  .brand-title { font-size: 14px; font-weight: 900; color: var(--yellow); letter-spacing: 1px; }
  .brand-sub { font-size: 10.5px; color: var(--muted); }
  .logout-btn {
    background: var(--card2); border: 1px solid var(--line); color: var(--muted2);
    border-radius: 9px; padding: 8px 14px; font-size: 12px; font-weight: 700; cursor: pointer;
  }

  .container { max-width: 480px; margin: 0 auto; padding: 20px; }

  .state-box { text-align: center; padding: 60px 20px; color: var(--muted2); font-size: 13px; }

  .welcome-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; margin-bottom: 16px;
  }
  .welcome-card h2 { font-size: 17px; margin: 0 0 4px; }
  .welcome-card p { font-size: 12.5px; color: var(--muted2); margin: 0; }

  .info-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid #1c2940; font-size: 13px;
  }
  .info-row:last-child { border-bottom: none; }
  .info-row .l { color: var(--muted2); }
  .info-row .v { font-weight: 700; }

  .role-pill { font-size: 10.5px; padding: 4px 10px; border-radius: 20px; font-weight: 700; }
  .role-yonetici { background: rgba(245,158,11,0.14); color: var(--yellow-light); }
  .role-saha_personeli { background: rgba(59,130,246,0.14); color: #93c5fd; }
  .role-sadece_rapor { background: rgba(100,116,139,0.2); color: var(--muted2); }

  .trial-badge {
    display: flex; align-items: center; gap: 8px; background: rgba(34,197,94,0.1);
    border: 1px solid rgba(34,197,94,0.3); border-radius: 9px; padding: 10px 12px;
    font-size: 12px; color: #86efac; margin-bottom: 16px;
  }

  .placeholder-card {
    background: var(--card2); border: 1px dashed var(--line); border-radius: 12px;
    padding: 20px; text-align: center; color: var(--muted2); font-size: 12.5px;
  }

  .err-box {
    background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3);
    color: #fca5a5; border-radius: 10px; padding: 14px; font-size: 12.5px;
  }
</style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <div class="logo">K</div>
      <div>
        <div class="brand-title">KAZI TAKİP</div>
        <div class="brand-sub" id="firmaAdiHeader">—</div>
      </div>
    </div>
    <div class="logout-btn" onclick="cikisYap()">Çıkış Yap</div>
  </div>

  <div class="container" id="container">
    <div class="state-box" id="loadingBox">Yükleniyor...</div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://wqqdcowrtlvfruvsmtew.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_bfPBnm138vlmJa_z4Pi95w_EsYw2zkB';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const rolEtiketleri = {
    yonetici: 'Yönetici',
    saha_personeli: 'Saha Personeli',
    sadece_rapor: 'Sadece Rapor'
  };
  const planEtiketleri = {
    deneme: 'Deneme Sürümü',
    aktif: 'Aktif',
    gecikmis: 'Gecikmiş Ödeme',
    iptal: 'İptal Edildi'
  };

  async function init() {
    const { data: { session } } = await sb.auth.getSession();

    if (!session) {
      window.location.href = 'auth.html';
      return;
    }

    // Kendi profilini + bağlı olduğu firmayı RLS üzerinden çekiyoruz —
    // burada başka bir firmanın verisi asla gelmez, sadece kendi firman.
    const { data: profil, error } = await sb
      .from('kullanicilar')
      .select('ad_soyad, email, rol, firma_id, firmalar ( ad, plan_durumu, deneme_bitis_tarihi )')
      .eq('id', session.user.id)
      .single();

    const container = document.getElementById('container');

    if (error || !profil) {
      container.innerHTML = `<div class="err-box">Profil bilgisi alınamadı: ${(error && error.message) || 'bilinmeyen hata'}</div>`;
      return;
    }

    const firma = profil.firmalar;
    document.getElementById('firmaAdiHeader').textContent = firma.ad;

    const kalanGun = Math.max(0, Math.ceil((new Date(firma.deneme_bitis_tarihi) - new Date()) / 86400000));

    container.innerHTML = `
      <div class="welcome-card">
        <h2>Hoş geldin, ${profil.ad_soyad.split(' ')[0]}</h2>
        <p>${firma.ad}</p>
      </div>

      ${firma.plan_durumu === 'deneme' ? `
        <div class="trial-badge">⏳ &nbsp;Deneme sürümünde ${kalanGun} gün kaldı</div>
      ` : ''}

      <div class="welcome-card">
        <div class="info-row"><span class="l">E-posta</span><span class="v">${profil.email}</span></div>
        <div class="info-row"><span class="l">Rol</span><span class="role-pill role-${profil.rol}">${rolEtiketleri[profil.rol] || profil.rol}</span></div>
        <div class="info-row"><span class="l">Plan Durumu</span><span class="v">${planEtiketleri[firma.plan_durumu] || firma.plan_durumu}</span></div>
      </div>

      <div class="placeholder-card">
        📊 Dashboard, Projeler, Kayıtlar ve diğer ekranlar sıradaki adımlarda buraya eklenecek.
      </div>
    `;
  }

  async function cikisYap() {
    await sb.auth.signOut();
    window.location.href = 'auth.html';
  }

  init();
</script>
</body>
</html>
